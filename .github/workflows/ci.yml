name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Check that the schema has a migration
        run: |
          npm run db:generate -- --name ci-check
          if [ -n "$(git status --porcelain --untracked-files=all -- drizzle)" ]; then
            echo "Database schema changes must include a reviewed Drizzle migration."
            git status --short -- drizzle
            exit 1
          fi

      - name: Build production bundle
        run: npm run build
